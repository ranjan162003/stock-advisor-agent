[project]
name = "stock-advisor-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the Stock Advisor Agent: market data, scoring, and LLM recommendations."
requires-python = ">=3.10"
dependencies = [
    # --- Web API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # --- Database ---
    "sqlalchemy>=2.0",
    # --- Market data + analysis ---
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    # --- LLM providers ---
    "anthropic>=0.70",
    "httpx>=0.27",
    # --- Secrets (API keys stored in the OS credential vault) ---
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv]
# This is an application, not a library: install its dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
